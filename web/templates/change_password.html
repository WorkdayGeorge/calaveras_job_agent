{% extends "base.html" %}{% block content %}<div class="card" style="max-width:560px;margin:auto"><h1>Change password</h1><p class="muted">Use at least 12 characters.</p>{% if error %}<p class="bad">{{ error }}</p>{% endif %}<form method="post"><label>Current password</label><input name="current_password" type="password" autocomplete="current-password" required><label>New password</label><input name="new_password" type="password" minlength="12" autocomplete="new-password" required><label>Confirm new password</label><input name="confirm_password" type="password" minlength="12" autocomplete="new-password" required><button class="btn" style="margin-top:16px">Change password</button></form></div>{% endblock %}
