<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a new password</title><style>body{font-family:system-ui;background:#f5f7fb;display:grid;place-items:center;height:100vh;margin:0;color:#162033}.card{width:min(420px,92vw);background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:28px}input,button{width:100%;padding:12px;border-radius:9px;box-sizing:border-box;margin-top:10px}input{border:1px solid #cfd4dc}button{border:0;background:#2563eb;color:#fff;font-weight:700}.error{color:#b42318}</style></head><body><div class="card"><h1>Choose a new password</h1>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="token" value="{{ token }}"><input name="new_password" type="password" minlength="12" placeholder="New password" required><input name="confirm_password" type="password" minlength="12" placeholder="Confirm password" required><button>Reset password</button></form></div></body></html>
