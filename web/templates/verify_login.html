<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify sign in</title>
<style>body{font-family:system-ui;background:#f5f7fb;display:grid;place-items:center;height:100vh;margin:0;color:#162033}.card{width:min(420px,92vw);background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:28px}input,button{width:100%;padding:12px;border-radius:9px;box-sizing:border-box}input{border:1px solid #cfd4dc}button{margin-top:14px;border:0;background:#2563eb;color:#fff;font-weight:700}.error{color:#b42318}</style></head>
<body><div class="card"><h1>Check your email</h1><p>Enter the six-digit sign-in code. It expires in 10 minutes.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus><button>Verify</button></form></div></body></html>
