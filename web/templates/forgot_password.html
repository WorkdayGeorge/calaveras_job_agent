<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password</title><style>body{font-family:system-ui;background:#f5f7fb;display:grid;place-items:center;height:100vh;margin:0;color:#162033}.card{width:min(420px,92vw);background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:28px}input,button{width:100%;padding:12px;border-radius:9px;box-sizing:border-box}input{border:1px solid #cfd4dc}button{margin-top:14px;border:0;background:#2563eb;color:#fff;font-weight:700}.good{color:#16803c}</style></head><body><div class="card"><h1>Reset password</h1>{% if message %}<p class="good">{{ message }}</p>{% else %}<p>Enter the email address used for your account.</p><form method="post"><input name="email" type="email" required><button>Send reset link</button></form>{% endif %}<p><a href="/login">Return to sign in</a></p></div></body></html>
