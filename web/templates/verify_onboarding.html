<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify email</title>
<style>body{font-family:system-ui;background:#f5f7fb;display:grid;place-items:center;min-height:100vh;margin:0;color:#162033}.card{width:min(420px,92vw);background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:28px}input,button{width:100%;padding:12px;border-radius:9px;box-sizing:border-box}input{border:1px solid #cfd4dc}button{margin-top:14px;border:0;background:#2563eb;color:#fff;font-weight:700}.secondary{background:#475467}.error{color:#b42318}.good{color:#16803c}</style></head>
<body><div class="card"><h1>Verify your email</h1><p>Enter the six-digit code sent to your email. It expires in 10 minutes.</p>{% if request.query_params.get('message') %}<p class="good">{{ request.query_params.get('message') }}</p>{% endif %}{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus><button>Verify and continue</button></form><form method="post" action="/onboarding/resend-code"><button class="secondary">Send a new code</button></form></div></body></html>
